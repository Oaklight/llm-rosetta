name: moonshot
base: openai_chat
logo: https://cdn.jsdelivr.net/npm/@lobehub/icons-static-svg@latest/icons/moonshot.svg

# Domestic (China mainland): api.moonshot.cn; international: api.moonshot.ai
connection:
  base_url: https://api.moonshot.cn/v1
  api_key_env: MOONSHOT_API_KEY
reasoning:
  thinking_modes:
    enabled: enabled
    disabled: disabled
  effort_field: reasoning_effort
  effort_range: [low, max]
