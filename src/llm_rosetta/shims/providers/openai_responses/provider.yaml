name: openai_responses
base: openai_responses
logo: https://cdn.jsdelivr.net/npm/@lobehub/icons-static-svg@latest/icons/openai.svg

connection:
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY

tools:
  # Kinds this provider can accept from cross-format translation.  A bare
  # `file_search` requires `vector_store_ids`, which cannot be synthesised
  # from a foreign request, so it is not listed here (it is still recognised
  # on the source side and round-trips same-format via the preserved native
  # payload).
  intrinsic_tools:
    - web_search
    - code_interpreter
  custom_tools: true
  search_mode: native
response_id_prefix: "resp_"
reasoning:
  effort_field: reasoning.effort
  effort_range: [minimal, max]
  visibility_modes:
    auto: auto
    concise: concise
    detailed: detailed

