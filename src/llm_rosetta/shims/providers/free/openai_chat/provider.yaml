# Free model source.
#
# A public gateway that serves a free model pool. Requests carry no
# credential while no API key is configured (`keyless`); supplying a key
# switches back to Bearer auth, so a user with a subscription uses the same
# shim. The admin UI presents this neutrally as "Free" — the vendor is named
# only in the repository docs.
name: free--openai_chat
base: openai_chat
free_source: true

connection:
  base_url: https://api.kilo.ai/api/gateway
  models_path: /models
  keyless: true
