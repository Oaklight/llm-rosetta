name: argo--open_responses
base: open_responses
logo: https://i.111666.best/image/wgp6hAUArNq2O6pICMRRvj.png

connection:
  base_url: https://apps.inside.anl.gov/argoapi/v1
  api_key_env: ARGO_API_KEY
  model_id_field: internal_id

tools:
  custom_tools: true
  max_description_length: 1024
reasoning:
  effort_field: reasoning.effort

soft_error_patterns:
  - pattern: "AUTHENTICATION NOTICE FROM ARGO"
    status_code: 403
    message: >-
      ARGO authentication error: the upstream ARGO gateway rejected the
      request. Verify your username and API key configuration.

# ARGO returns "resp_"-prefixed response ids, so the prefix is stripped on the
# way in and re-added on the way out.  Verified live 2026-10-12 (see #899).
response_id_prefix: "resp_"

# Echo fields ARGO actually populates, verified live 2026-10-12 (see #899):
# ``content_filters`` carries per-source filter results and ``tool_usage``
# counts image-gen and search calls.  ``access_programs``, ``billing`` and
# ``moderation`` come back present but always null, and nulls are never
# captured as echo, so they are not declared.  ARGO ignores a requested
# ``store`` and always reports ``store: false``, so it declares no
# ``store_default`` either.
preserve_fields:
  - content_filters
  - tool_usage
