name: argo--anthropic
base: anthropic
logo: https://i.111666.best/image/wgp6hAUArNq2O6pICMRRvj.png

connection:
  base_url: https://apps.inside.anl.gov/argoapi
  api_key_env: ARGO_API_KEY
  model_id_field: internal_id
reasoning:
  thinking_modes:
    auto: adaptive
    enabled: enabled
    disabled: disabled
  thinking_default: auto
  effort_field: output_config.effort
  effort_range: [low, max]
  budget_ratio: 0.8
  visibility_modes:
    auto: summarized
    concise: summarized
    detailed: summarized
    none: omitted
  unsigned_blocks: preserve
  # Argo Anthropic thinking support matrix (probed 2026-09-28):
  #   Gen 1 (4.5):     enabled+budget only (adaptive → 400)
  #   Gen 2 (4.6):     enabled+budget + adaptive
  #   Gen 3 (4.7+):    adaptive only (enabled → 400)
  model_overrides:
    claudehaiku45:
      thinking_modes: {enabled: enabled, disabled: disabled}
      budget_ratio: 0.8
    claudesonnet45:
      thinking_modes: {enabled: enabled, disabled: disabled}
      budget_ratio: 0.8
    claudeopus45:
      thinking_modes: {enabled: enabled, disabled: disabled}
      budget_ratio: 0.8
    # claudesonnet46 and claudeopus46: default modes work (both enabled+budget and adaptive)
    claudeopus47:
      thinking_modes: {auto: adaptive, enabled: adaptive, disabled: disabled}
    claudeopus48:
      thinking_modes: {auto: adaptive, enabled: adaptive, disabled: disabled}
    claudesonnet5:
      thinking_modes: {auto: adaptive, enabled: adaptive, disabled: disabled}
    claudeopus5:
      thinking_modes: {auto: adaptive, enabled: adaptive, disabled: disabled}

soft_error_patterns:
  - pattern: "AUTHENTICATION NOTICE FROM ARGO"
    status_code: 403
    message: >-
      ARGO authentication error: the upstream ARGO gateway rejected the
      request. Verify your username and API key configuration.
