name: deepseek--openai_responses
base: open_responses
logo: https://cdn.jsdelivr.net/npm/@lobehub/icons-static-svg@latest/icons/deepseek.svg

connection:
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
reasoning:
  thinking_modes:
    enabled: enabled
    disabled: disabled
  effort_field: reasoning.effort
  effort_range: [low, max]
# OpenAI Responses profile: extra lifecycle/echo fields + server-side
# storage default (the vendor-neutral spec omits both).
preserve_fields:
  - access_programs
  - billing
  - content_filters
  - moderation
  - tool_usage
store_default: true
