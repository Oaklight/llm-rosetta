name: deepseek--open_responses
base: open_responses
logo: https://cdn.jsdelivr.net/npm/@lobehub/icons-static-svg@latest/icons/deepseek.svg

connection:
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
reasoning:
  thinking_modes:
    enabled: enabled
    disabled: disabled
  effort_field: reasoning.effort
  effort_range: [low, max]
# DeepSeek's /responses endpoint is stateless: it ignores a requested
# ``store: true`` and always reports ``store: false``, so it declares no
# ``store_default``.  Its response id is a bare UUID (no ``resp_`` prefix).
# Of the OpenAI lifecycle fields it emits only ``content_filters`` and
# ``moderation``, both always null, and nulls are never captured as echo, so
# neither profile trait applies.  Verified live 2026-10-12 (see #899).
