# Kilo — free model source.
#
# Kilo's public gateway serves a free model pool. Requests carry no credential
# while no API key is configured (`keyless`); supplying a key switches back to
# Bearer auth, so a user with a subscription uses the same shim. As a keyless
# entry the admin UI shows it as "Kilo (Free)" and groups it under the Free
# Resource section.
name: kilo--chat_completions
base: chat_completions
# `group_label` titles the vendor's top level in the admin picker; with no
# `group` the key is still derived from the name (`kilo`).  The shim's own
# label is left unset, so its row reads as the bare base format.
group_label: Kilo
logo: https://cdn.jsdelivr.net/npm/@lobehub/icons-static-svg@latest/icons/kilocode.svg
free_source: true

connection:
  base_url: https://api.kilo.ai/api/gateway
  models_path: /models
  keyless: true
