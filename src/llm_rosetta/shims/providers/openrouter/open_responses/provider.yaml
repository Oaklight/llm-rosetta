name: openrouter--open_responses
base: open_responses
logo: https://cdn.jsdelivr.net/npm/@lobehub/icons-static-svg@latest/icons/openrouter.svg

connection:
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY

# Vendor-neutral spec behavior, confirmed live 2026-10-12 (see #899):
# OpenRouter rejects ``store: true`` with HTTP 400 ("store: true is not
# supported on this proxy. Each response request is independent."), returns a
# ``gen-...`` id with no ``resp_`` prefix, and emits none of the OpenAI
# lifecycle/echo fields.  No profile traits are declared, by design.
