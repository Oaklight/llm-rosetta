name: openrouter--messages
base: messages
logo: https://cdn.jsdelivr.net/npm/@lobehub/icons-static-svg@latest/icons/openrouter.svg

connection:
  base_url: https://openrouter.ai/api
  api_key_env: OPENROUTER_API_KEY
reasoning:
  thinking_modes:
    auto: adaptive
    enabled: enabled
    disabled: disabled
  effort_field: output_config.effort
  effort_range: [low, max]

  # OpenRouter validates the Messages schema itself and rejects a thinking
  # block with no signature: probed live 2026-10-13, it answers `400 Invalid
  # Anthropic Messages API request` with `invalid_union` at path
  # `[messages, 0, "signature"]`.  The block is kept in metadata instead of
  # being sent.  See #954.
  unsigned_blocks: preserve
