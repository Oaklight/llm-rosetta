name: open_responses
base: open_responses
logo: https://cdn.jsdelivr.net/gh/openresponses/openresponses@main/public/svg/openresponses.svg
# Open Responses is a vendor-neutral specification, so this shim declares no
# canonical host (no ``connection.base_url``); the gateway registry falls back
# to OpenRouter.  Deployments targeting another host (e.g. vLLM or Ollama) must
# set ``connection.base_url`` here or ``base_url`` in their provider config.
tools:
  custom_tools: true
  search_mode: native
# No ``response_id_prefix``: the spec defines no prefix, so response IDs are
# passed through verbatim (e.g. OpenRouter's ``gen-...`` identifiers).
reasoning:
  effort_field: reasoning.effort
  effort_range: [minimal, max]
  visibility_modes:
    auto: auto
    concise: concise
    detailed: detailed
