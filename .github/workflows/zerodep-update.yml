name: zerodep-update

on:
  schedule:
    - cron: "17 3 * * 1" # Weekly Monday 3:17 UTC
  workflow_dispatch:

# NOTE: PRs created by the default GITHUB_TOKEN do not trigger
# on:pull_request workflows. If you need CI checks on the auto-PR,
# use a GitHub App token or PAT instead of github.token.
permissions:
  contents: write
  pull-requests: write

env:
  PYTHONIOENCODING: utf-8

concurrency:
  group: zerodep-update
  cancel-in-progress: false

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install zerodep CLI
        # The lock file needs 2026.10.23.1+. The guard script checks versions
        # itself, so an older CLI still cannot downgrade a module.
        run: pip install 'zerodep>=2026.10.23.1'

      - name: Inspect vendored modules
        id: state
        run: |
          python3 .github/scripts/zerodep_guard.py inspect \
            "$RUNNER_TEMP/zerodep-plan.json" "$GITHUB_STEP_SUMMARY" \
            . \
            packages/llm-rosetta-gateway >> "$GITHUB_OUTPUT"

      - name: Update safe modules
        if: steps.state.outputs.has_updates == 'true'
        run: |
          python3 .github/scripts/zerodep_guard.py update \
            "$RUNNER_TEMP/zerodep-plan.json"

      - name: Verify nothing was downgraded
        if: steps.state.outputs.has_updates == 'true'
        run: |
          python3 .github/scripts/zerodep_guard.py verify \
            "$RUNNER_TEMP/zerodep-plan.json" "$GITHUB_STEP_SUMMARY"

      - name: Create or update Pull Request
        if: steps.state.outputs.has_updates == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: zerodep-update
          delete-branch: true
          title: "chore(deps): update vendored zerodep modules"
          body: |
            Automated update of vendored zerodep modules.

            The workflow updates only modules whose locked version is not
            newer than upstream. Modules it skipped, and modules whose content
            changed without a version change, are listed below.

            ${{ steps.state.outputs.modules }}
          labels: dependencies,zerodep
          commit-message: "chore(deps): update vendored zerodep modules"
