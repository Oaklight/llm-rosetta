name: API compatibility

# Compares the public surface (`__all__` names and their parameters) of the
# latest stable vX.Y.Z tag with the working tree.  Removing a name or parameter
# fails the check unless the old spelling keeps a deprecated alias or the break
# is recorded in scripts/dev/public_api_allowlist.json.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  public-api-diff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          # Tags are needed to find the latest stable release.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/llm-rosetta[all]" -e packages/llm-rosetta-gateway

      - name: Compare public API with the latest stable release
        run: python scripts/dev/public_api_diff.py --github-summary
