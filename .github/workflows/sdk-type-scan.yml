name: SDK Type Coverage Scan

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install project with SDK extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[openai,anthropic,google]"

      - name: Upgrade SDKs to latest versions
        run: pip install --upgrade openai anthropic google-genai

      - name: Run type coverage scan
        run: python scripts/scan_sdk_types.py >> "$GITHUB_STEP_SUMMARY"
