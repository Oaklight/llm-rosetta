name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.7.0)"
        required: true
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history + tags so back-releases can resolve an
          # existing v<version> tag rather than only the default branch.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve tag and verify version
        run: |
          VERSION="${{ inputs.version }}"
          TAG="v$VERSION"
          # One regex, four readers: the tag and the working tree, for the
          # core and the gateway.  Two copies of this pattern drift.
          ver_of() { sed -n 's/^__version__ = "\(.*\)"/\1/p'; }
          CORE_INIT=packages/llm-rosetta/src/llm_rosetta/__init__.py
          GW_INIT=packages/llm-rosetta-gateway/src/llm_rosetta_gateway/__init__.py
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            # Back-release: tag already exists. Verify __init__.py *at the tag*
            # matches, so we publish exactly what was tagged.
            echo "Tag $TAG already exists — back-release mode."
            # A tag cut before the split has no gateway package, and this
            # workflow builds both distributions from the tag.  Fail with the
            # reason rather than an empty version plus a confusing sed error.
            if ! git cat-file -e "$TAG:$GW_INIT" 2>/dev/null; then
              echo "::error::Tag $TAG predates the two-distribution split; it cannot be re-released with this workflow."
              exit 1
            fi
            PKG_VER=$(git show "$TAG:$CORE_INIT" | ver_of)
            GW_VER=$(git show "$TAG:$GW_INIT" | ver_of)
            echo "Core version at $TAG: $PKG_VER"
            echo "Gateway version at $TAG: $GW_VER"
            [ "$PKG_VER" = "$VERSION" ] || \
              (echo "::error::Version mismatch: $TAG has core $PKG_VER but release requested $VERSION"; exit 1)
            [ "$GW_VER" = "$VERSION" ] || \
              (echo "::error::Version mismatch: $TAG has gateway $GW_VER but release requested $VERSION"; exit 1)
          else
            # Fresh release: verify the current checkout, then create the tag.
            echo "Tag $TAG does not exist — fresh release mode."
            PKG_VER=$(ver_of < "$CORE_INIT")
            GW_VER=$(ver_of < "$GW_INIT")
            echo "Core version: $PKG_VER"
            echo "Gateway version: $GW_VER"
            [ "$PKG_VER" = "$VERSION" ] || \
              (echo "::error::Version mismatch: core __init__.py has $PKG_VER but release requested $VERSION"; exit 1)
            [ "$GW_VER" = "$VERSION" ] || \
              (echo "::error::Version mismatch: gateway __init__.py has $GW_VER but release requested $VERSION"; exit 1)
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi

  build-publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel + sdist
        run: |
          pip install --upgrade pip build
          python -m build packages/llm-rosetta --outdir dist
          python -m build packages/llm-rosetta-gateway --outdir dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          retention-days: 7

  docker:
    needs: build-publish
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ inputs.version }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  github-release:
    needs: build-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ inputs.version }}"
          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            # Back-release: release already exists, just (re)upload artifacts.
            echo "Release $TAG already exists — uploading artifacts."
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$REPO" \
              --title "$TAG" \
              --generate-notes
          fi
