name: Shim drift

# Two things live in the five published shim packages and nowhere else:
# the workflow that publishes their `dist` archive, and the archives it
# produces.  Neither is visible to this repository's CI, which only runs on a
# push to master — so a package can drift, or stop publishing, and nobody
# learns until someone wants a mirror.
#
# This job asks both questions on a schedule.  It is separate from `ci.yml` on
# purpose: a nightly run of the full test suite would spend an hour for two
# HTTP checks.
#
# A red check in the Actions tab is not "somebody noticed", so a failure opens
# an issue — one issue, updated in place, commented on only when the problem
# set changes, and closed only when a timer run is green.  The reasoning lives
# in `scripts/dev/report_shim_drift.py`.

on:
  schedule:
    # Off the hour: every scheduled workflow in the ecosystem fires at :00.
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # The report step opens, updates and closes one issue.  It is the only
  # workflow in this repository that writes to the tracker, so the permission
  # is visible here rather than inherited from a default.
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Every package names the repositories the catalogue lists
        # `continue-on-error` so the report step still runs and files the verdict.
        id: catalog
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/dev/check_shim_catalog.py 2>&1 | tee catalog.log

      - name: Report the verdict to the tracker
        # Runs whatever the checks said, so a green timer run is what closes the
        # issue.  A failed report fails the job: a reporter that speaks to
        # nobody is the failure mode this step exists to remove.
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/dev/report_shim_drift.py \
            --problems catalog.log \
            --repo "${{ github.repository }}" \
            --event "${{ github.event_name }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
