name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Per-package groups (epic #1127).  The filters below only say which paths
# belong to which package; the dependency direction is applied in the step and
# job conditions: the gateway imports the core, so a core change runs the
# gateway group too, while a gateway-only change skips the converter suite.
# Pushes to master always run everything, so the merge commit is never
# under-tested.
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      core: ${{ steps.filter.outputs.core }}
      gateway: ${{ steps.filter.outputs.gateway }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'packages/llm-rosetta/**'
              - 'tests/**'
              - '!tests/gateway/**'
              - '!tests/js/**'
              # Tests drive these: test_public_api_diff/test_migration_differential
              # execute scripts/dev/*, check_shim_removals and the token scripts
              # are read as source, and tests/conformance imports tools/conformance.
              - 'scripts/**'
              - 'tools/**'
              - 'pyproject.toml'
              - 'pytest.ini'
              - 'Makefile'
              - '.pre-commit-config.yaml'
              - '.github/workflows/ci.yml'
            gateway:
              - 'packages/llm-rosetta-gateway/**'
              - 'tests/gateway/**'
              - 'tests/js/**'
              - 'tools/theme_matrix/**'
              - '.github/workflows/ci.yml'

  shim-removal-check:
    # Passes while the version is below every scheduled removal; fails on its own
    # once the version reaches one, so a removal cannot land without the cleanup
    # that belongs with it (epic #927).
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # docs_en / docs_zh are separate worktrees, so they are absent from the
      # checkout above and have to be asked for by name.
      - uses: actions/checkout@v6
        with:
          ref: docs_en
          path: docs_en

      - uses: actions/checkout@v6
        with:
          ref: docs_zh
          path: docs_zh

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/llm-rosetta -e packages/llm-rosetta-gateway

      - name: Check scheduled shim removals
        run: make check-shim-removals

  docs-build:
    # The docs live on two orphan branches, and Read the Docs builds them by
    # running *their* .readthedocs.yaml: a pre_build that clones this
    # repository and copies the source into the branch, then a zensical build.
    # That copy is a hard-coded path, so it silently rots when the layout
    # moves — which is how a distribution split left both sites failing for
    # weeks with every local check green.
    #
    # This job runs the branch's own steps rather than repeating them, through
    # scripts/dev/rtd_build.py: a CI job that re-describes the copy keeps
    # passing while the branch's yaml is broken, which is the failure it
    # exists to catch.  The clone is redirected at this checkout, so no
    # network is needed.
    #
    # Coverage: a change on master that the docs still reference is caught on
    # this PR.  A commit to a docs branch is NOT covered until the next PR
    # here — that would need a workflow on those branches.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [docs_en, docs_zh]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          ref: docs_en
          path: docs_en

      - uses: actions/checkout@v6
        with:
          ref: docs_zh
          path: docs_zh

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install the docs toolchain
        # Deliberately not the packages: RTD imports the source the branch
        # copies, and an editable install here would hide a missing copy.
        run: |
          python -m pip install --upgrade pip
          pip install -r docs_en/requirements.txt

      - name: Run the branch's own Read the Docs steps
        run: python scripts/dev/rtd_build.py ${{ matrix.language }}

  lint-and-test:
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/llm-rosetta[all]" -e packages/llm-rosetta-gateway

      - name: Run pre-commit checks
        uses: pre-commit/action@v3.0.1

      - name: Run import boundary tests
        if: needs.changes.outputs.core == 'true'
        run: |
          python -m pytest tests/test_core_import_boundary.py \
                           tests/observability/test_import_boundary.py -q

      - name: Run admin UI tests
        if: needs.changes.outputs.gateway == 'true'
        run: node --test tests/js/*.test.mjs

      - name: Run gateway tests
        # The gateway imports the core, so a core change is a gateway change.
        if: needs.changes.outputs.gateway == 'true' || needs.changes.outputs.core == 'true'
        run: python -m pytest tests/gateway -v

      - name: Run root tests that reference the gateway
        # `tests/gateway/` is not the whole gateway surface: root-level tests
        # exercise the deprecated alias, the shim loader and the split itself
        # (`test_package_split`, `test_shim_sources`, `test_sync_compat`, …).
        # Discovered rather than listed, so a new one cannot be forgotten.
        if: needs.changes.outputs.gateway == 'true'
        run: |
          # `tests/integration/` is excluded on purpose: these are live tests
          # that need credentials and reach the network (the shim presets one
          # calls the GitHub API), and `make test` excludes them too.  A PR
          # that touches `tests/` used to run them here, so a rate limit on
          # api.github.com could fail a change that never touched a shim.
          mapfile -t files < <(grep -rl "llm_rosetta_gateway" tests --include=*.py \
            | grep -v -e '^tests/gateway/' -e '^tests/js/' -e '^tests/integration/')
          python -m pytest "${files[@]}" -q

      - name: Run converter tests
        if: needs.changes.outputs.core == 'true'
        run: python -m pytest tests/converters/ -v

      - name: Run type compatibility tests
        if: needs.changes.outputs.core == 'true'
        run: python -m pytest tests/test_types/ -v

  conformance:
    # The wire and fields suites are offline and deterministic, so they can
    # gate every PR: their committed baselines turn a conversion behaviour
    # change into a named diff (`generation.top_k: lost`) or a new upstream
    # field rather than a flaky red build.  Upstream probing — what a vendor
    # accepts and echoes — needs credentials and stays out of PR CI until the
    # scheduled group lands (epic #1128).
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        # `[all]` pulls the `gateway` extra, which names `llm-rosetta-gateway` by
        # distribution; the gateway is not on PyPI, so its local path has to be
        # installed beside it (and `tools/conformance/redact.py` imports it).
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/llm-rosetta[all]" -e packages/llm-rosetta-gateway

      - name: Run the wire suite against its baseline
        run: python -m tools.conformance run --suite wire --out wire-report.json

      - name: Run the fields suite against its ledger
        run: python -m tools.conformance run --suite fields --out fields-report.json

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance
          path: |
            wire-report.json
            fields-report.json
          # A run that produced no report is not a run: the default warning
          # would let this step look green on an install failure.
          if-no-files-found: error

  theme-matrix:
    # The contract test reads the CSS and says what a scheme may declare; this
    # renders the panel and says what came out.  The probes gate the job (the
    # Token card's details link must be clickable in every scheme), and the
    # screenshots ship as an artifact for review.  No pixel baseline, so the
    # job is not sensitive to fonts or the runner image.
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/llm-rosetta -e packages/llm-rosetta-gateway
          pip install "playwright>=1.40,<2"
          python -m playwright install --with-deps chromium

      - name: Render the theme matrix
        run: python -m tools.theme_matrix --out theme-matrix-out

      - name: Upload the report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-matrix
          path: theme-matrix-out/
          if-no-files-found: error


  dev-extras-test:
    needs: changes
    # The full suite is the cross-package safety net: it runs when the core
    # changed (a gateway-only PR is covered by the gateway group above) and
    # always on master, so the merge commit is never under-tested.
    if: github.event_name == 'push' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dev extras alone in a fresh venv
        run: |
          python -m venv /tmp/dev-extras-venv
          /tmp/dev-extras-venv/bin/pip install --upgrade pip
          /tmp/dev-extras-venv/bin/pip install -e "packages/llm-rosetta[dev]" -e packages/llm-rosetta-gateway

      - name: Run test suite
        run: /tmp/dev-extras-venv/bin/python -m pytest tests/ --ignore=tests/integration

  smoke-test-core:
    name: smoke-test (core)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel packages/llm-rosetta --outdir dist
          python -m build --wheel packages/llm-rosetta-gateway --outdir dist

      - name: Install the core wheel in a clean venv
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --upgrade pip
          /tmp/smoke-venv/bin/pip install dist/llm_rosetta-*.whl

      - name: Smoke test imports
        run: |
          source /tmp/smoke-venv/bin/activate
          python -c "from llm_rosetta import get_converter_for_provider; print('core import OK')"
          python -c "from llm_rosetta.converters.google_generate.content_ops import GoogleGenerateContentOps; print('google generate converter OK')"
          python -c "from llm_rosetta import GoogleInteractionsConverter; print('google interactions converter OK')"
          python -c "from llm_rosetta.converters.decisions import SystemOneDecisionConverter; print('decision converter OK')"

  smoke-test-gateway:
    name: smoke-test (gateway)
    needs: changes
    # The gateway is downstream of the core, so a core change validates it too.
    if: |
      github.event_name == 'push' ||
      needs.changes.outputs.core == 'true' ||
      needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel packages/llm-rosetta --outdir dist
          python -m build --wheel packages/llm-rosetta-gateway --outdir dist

      - name: Install both wheels in a clean venv
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --upgrade pip
          /tmp/smoke-venv/bin/pip install dist/llm_rosetta-*.whl dist/llm_rosetta_gateway-*.whl

      - name: Smoke test imports
        run: |
          source /tmp/smoke-venv/bin/activate
          python -c "from llm_rosetta_gateway import main; print('gateway import OK')"
          llm-rosetta-gateway --version
