version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    allow:
      - dependency-name: "openai"
      - dependency-name: "anthropic"
      - dependency-name: "google-genai"
    groups:
      llm-sdks:
        patterns:
          - "openai"
          - "anthropic"
          - "google-genai"

