[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-rosetta-gateway"
dynamic = ["version"]
authors = [{ name = "Oaklight", email = "oaklight@gmx.com" }]
description = "LLM-Rosetta Gateway — an HTTP proxy that accepts any supported LLM API format and forwards it to any configured upstream."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
]
# Same-minor compatibility: core patch releases are accepted without a
# gateway release; a new core minor requires a matching gateway.
dependencies = ["llm-rosetta>=0.14.0.dev0,<0.15"]

[project.urls]
Documentation = "https://llm-rosetta.readthedocs.io"
Repository = "https://github.com/Oaklight/llm-rosetta"
Issues = "https://github.com/Oaklight/llm-rosetta/issues"

[project.scripts]
llm-rosetta-gateway = "llm_rosetta_gateway:main"
llm-rosetta-usage = "llm_rosetta_gateway.observability.usage.cli:main"
llm-rosetta-migrate = "llm_rosetta_gateway.maintenance.migrate_0140:main"

# The gateway's commands for the ``llm-rosetta`` dispatcher (and, for ``serve``,
# the one ``llm-rosetta-gateway`` runs).  ``main()`` registers the same specs
# explicitly for a host that has no package metadata, such as the Nuitka binary.
# The summaries come from each callable's docstring.
[project.entry-points."llm_rosetta.commands"]
serve = "llm_rosetta_gateway.cli:serve_main"
init = "llm_rosetta_gateway.cli:init_main"
add = "llm_rosetta_gateway.cli:add_main"
credential = "llm_rosetta_gateway.cli:credential_main"
password = "llm_rosetta_gateway.cli:password_main"
db = "llm_rosetta_gateway.cli:db_main"
# Reads the gateway's own database, so it ships with the gateway (#1161).
usage = "llm_rosetta_gateway.observability.usage.cli:main"
# One-shot migration off the names that 0.14.0 retires.
migrate = "llm_rosetta_gateway.maintenance.migrate_0140:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"llm_rosetta_gateway.admin" = ["admin.html", "css/**/*.css", "js/**/*.js"]
# The changelog is written by the release workflow from the docs branches; a
# wheel built from source without them simply has no file to ship.
"llm_rosetta_gateway" = ["CHANGELOG.*.md"]

[tool.setuptools.dynamic]
version = { attr = "llm_rosetta_gateway.__version__" }

[tool.zerodep]
vendor-dir = "src/llm_rosetta_gateway/_vendor"
