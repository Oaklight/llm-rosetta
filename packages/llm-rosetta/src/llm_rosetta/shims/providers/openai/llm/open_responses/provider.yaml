# Name is ``openai--open_responses`` (provider--base) so the OpenAI profile is
# distinguishable from the vendor-neutral ``open_responses`` base.  The legacy
# spellings ``openai_responses`` / ``openai-responses`` are aliased to this name
# in ``provider_names.LEGACY_PROVIDER_ALIASES``.
name: openai--open_responses
# OpenAI Responses is a profile of the vendor-neutral Open Responses base;
# the profile traits are opt-in settings below.
model_type: llm
format: open_responses
logo: https://cdn.jsdelivr.net/npm/@lobehub/icons-static-svg@latest/icons/openai.svg

connection:
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY

tools:
  # Kinds this provider can accept from cross-format translation.  Measured
  # against the live API: `image_generation` needs no configuration and is
  # accepted bare, `code_interpreter` takes a synthesised `container: auto`.
  # The rest stay source-only because a foreign request carries nothing to
  # build them from — `file_search` needs `vector_store_ids`, `mcp` needs
  # `server_label`, `computer_use_preview` needs `environment`, and `shell` /
  # `tool_search` are model-gated.  They are still recognised on the source
  # side and round-trip same-format via the preserved native payload.
  intrinsic_tools:
    - web_search
    - code_interpreter
    - image_generation
  custom_tools: true
  search_mode: native
response_id_prefix: "resp_"
# OpenAI-only lifecycle/echo fields, added to the base spec's preserve set.
preserve_fields:
  - access_programs
  - billing
  - content_filters
  - moderation
  - tool_usage
# Request-bound fields OpenAI accepts beyond the neutral spec.  A client's
# value is forwarded only when the target is a provider that declares it;
# measured against the live API, `moderation` is accepted and
# `prompt_cache_options` is model-gated, while `logit_bias` and
# `access_programs` are rejected in their common shapes — they are declared
# anyway, because forwarding the client's own request reproduces the vendor's
# own answer instead of sampling a silently different one.
request_fields:
  - logit_bias
  - prompt_cache_options
  - moderation
  - access_programs
# OpenAI stores responses server-side by default; the spec is stateless.
store_default: true
reasoning:
  effort_field: reasoning.effort
  effort_range: [minimal, max]
  visibility_modes:
    auto: auto
    concise: concise
    detailed: detailed

