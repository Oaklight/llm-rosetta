# Google Antigravity — through the vendor's own CLI, over ACP.
#
# The lane does not call Google's Code Assist API.  It runs the local
# ``agy`` CLI (``agy acp``) and speaks the Agent Client Protocol to it, so
# the Google sign-in, the access token and the project stay with agy, exactly
# as they do when agy is used on its own.  The credential the gateway keeps
# is therefore not a key: ``auth.py`` asks agy whether it is signed in, and the
# admin panel starts agy's own sign-in on the gateway host.
#
# Why not call Code Assist directly: Google suspends accounts it sees calling
# Code Assist outside Antigravity's own client.  Driving the vendor's CLI
# keeps the request inside the client Google expects.
#
# Phase 1 runs agy as a text model: none of agy's own tools (file read and
# write, shell, web search, scheduling, sub-agents, workflows) is available.
# agy is an upstream here, not the gateway's client, and must not run a tool
# on the gateway host for an API request.  agy has no single switch for that,
# so the gateway starts it in a profile it owns (``agy acp --gemini-dir
# <data_dir>/acp/<provider>``) and layers four measures (agy 1.5.13): a custom
# agent with no tools, a deny-all PreToolUse hook, ``toolPermission: strict``
# in the profile's settings, and its own ACP client, which refuses every
# permission request and stops a turn at the first tool frame (HTTP 502).  The
# gateway re-asserts the profile before every turn.  Not measured: tools with
# lasting or outward effects (schedule, swarm, run_workflow, sub-agents,
# send_message) were not run; they are blocked by the same layers.  A provider
# entry that overrides ``acp_argv`` gets none of this and can re-enable the
# tools, at the operator's own risk.
group_label: Google (Antigravity)
logo: https://cdn.jsdelivr.net/npm/@lobehub/icons-static-svg@latest/icons/antigravity.svg

connection:
  # How often the gateway asks agy again whether it is still signed in.  Each
  # check starts one agy process, so this is minutes, not seconds.  A credential
  # fact, so it lives here and not in a leaf.
  token_refresh_interval: 900
