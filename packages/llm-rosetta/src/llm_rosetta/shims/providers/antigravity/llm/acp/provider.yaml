# Antigravity, served by the vendor's own CLI over ACP.
#
# ``agy`` owns the Google sign-in; this lane never sees a credential, so the
# vendor manifest declares it keyless.  Sign in on the gateway host first:
# run ``agy`` in a terminal and complete the Google sign-in (or
# ``agy acp --login``).  An unsigned-in agent refuses to open a session, and
# the gateway reports that as a 503 naming the sign-in step.
#
# The account rules are Google's: it may suspend an account it sees used
# outside Antigravity's own client.  Running agy is the least indirect way to
# use the plan; it is still a plan that can be lost.  See the provider guide.
name: antigravity--acp
model_type: llm
format: acp
group_label: Google (Antigravity)
logo: https://cdn.jsdelivr.net/npm/@lobehub/icons-static-svg@latest/icons/antigravity.svg

# What a model on this lane has when its config entry declares no
# ``capabilities``.  Images ride as inline ACP blocks and thought chunks come
# back as thinking blocks; client tools are dropped (``acp/tool_ops.py``), so
# ``tools`` is not declared.
default_capabilities: [text, vision, reasoning]

connection:
  # The lane is reached by starting a process, not by dialing this host.  It
  # is a placeholder that must be a URL (the transport contract is shared
  # with the HTTP lanes) and is never opened.
  base_url: http://agy.local
  transport: acp
  # Phase 1: agent tools are OFF.  agy auto-approves its own tools by default
  # (file read/write, shell, web), which would hand the gateway host to every
  # client of the gateway.  The flag makes agy ask first, the gateway puts
  # each session in agy's ``plan`` mode (which also asks before reading files
  # outside the workspace and the system temp dir), and the gateway's ACP
  # client refuses every ask.  agy's own policy still lets it read files under
  # the system temp dir.  Overriding ``acp_argv`` per provider entry without
  # this flag re-enables host tools, at the operator's own risk.
  acp_argv: ["agy", "acp", "--dangerously-skip-permissions=false"]

hint_msg:
  en: >-
    Runs the local agy CLI over ACP. Google may suspend an account it sees
    used outside Antigravity's own client; use an account you can afford to
    lose. Sign in on the gateway host first (run agy in a terminal). Agent
    tools (file writes, shell, reads outside the temp dir) are disabled, so
    agy answers in text; agy's own policy still lets it read files under the
    system temp dir. A custom acp_argv without
    --dangerously-skip-permissions=false re-enables host tools, at your own
    risk.
  zh: >-
    通过 ACP 驱动本机 agy CLI。Google 可能封禁被判定在 Antigravity 之外使用的账号，
    请只使用可以承受损失的账号。先在网关主机上登录（在终端运行 agy）。
    智能体工具（写文件、命令行、读取临时目录之外的文件）已禁用，agy 以文本作答；
    但 agy 自身策略仍允许其读取系统临时目录下的文件。自定义 acp_argv 若不含
    --dangerously-skip-permissions=false，会重新启用主机工具，风险自负。
