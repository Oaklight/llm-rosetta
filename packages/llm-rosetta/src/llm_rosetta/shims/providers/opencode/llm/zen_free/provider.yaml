# OpenCode — public free lane (Zen, key-free).
#
# The lane answers at https://opencode.ai/zen/v1 with `Authorization: Bearer
# public`, but only to a request shaped like the OpenCode desktop client:
#
#   * a User-Agent of opencode/<version> (>= 1.18.0),
#   * x-opencode-client / x-opencode-project,
#   * an x-opencode-session whose value decodes to a recent timestamp,
#   * at least one tool declared under the exact name `read`,
#   * stream: true.
#
# The connection block and transforms.py supply all five.  transforms.py also
# filters the model listing to the models whose declared cost is zero, and
# declares the injected `read` as a placeholder the model should not call.  See
# issue #884 for the measurement history; the gate is anti-abuse machinery, so
# this lane is offered as a free source with a third-party disclosure and may
# change or close without notice.
name: opencode_zen_free--chat_completions
model_type: llm
format: chat_completions
display_name: Zen free lane
free_source: true
logo: https://cdn.jsdelivr.net/npm/@lobehub/icons-static-svg@latest/icons/opencode.svg
hint_msg:
  en: "Keyless free pool. Only zero-cost models are served here; the model list is filtered to them."
  zh: "无密钥免费池。这里只服务零成本模型；模型列表已按此过滤。"

connection:
  base_url: https://opencode.ai/zen/v1
  keyless: true
  # A full URL for the same reason as the paid shims: base_url is normalised
  # per format, so a relative path resolves differently across formats.
  models_path: https://opencode.ai/zen/v1/models
  headers:
    # The lane's "credential" is the literal word `public`; `keyless: true`
    # means no real key is required, not that no Authorization header is sent.
    Authorization: "Bearer public"
    User-Agent: "opencode/1.19.0 ai-sdk/provider-utils/4.0.23 runtime/bun/1.3.14"
    x-opencode-client: desktop
    x-opencode-project: global
  # The gate decodes this value back into a timestamp, so the shim declares
  # OpenCode's identifier layout rather than the gateway's plain digest.
  session_header: x-opencode-session
  session_id_format: opencode
  request_header: x-opencode-request
  request_id_format: opencode
  # stream:false is refused with 403 even when everything else is valid.
  stream_required: true
