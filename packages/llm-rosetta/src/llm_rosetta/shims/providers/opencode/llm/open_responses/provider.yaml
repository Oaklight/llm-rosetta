# OpenCode — paid access gateway (OpenAI Responses endpoint).
#
# Serves the Grok / GPT / Muse Spark models that OpenCode routes through
# /responses.  Shares the credential and lanes described in the sibling
# chat_completions shim; Zen is a base_url override.
name: opencode--open_responses
model_type: llm
format: open_responses
logo: https://cdn.jsdelivr.net/npm/@lobehub/icons-static-svg@latest/icons/opencode.svg
hint_msg:
  en: "For the Zen balance lane set Base URL to https://opencode.ai/zen/v1 — the default is the Go subscription lane, and one API key signs both. The keyless free pool is a separate shim: opencode_zen_free--chat_completions."
  zh: "默认走 Go 订阅 lane。Zen 余额 lane 请把 Base URL 改为 https://opencode.ai/zen/v1，两者共用同一个 API Key。无密钥免费池是另一个 shim：opencode_zen_free--chat_completions。"

connection:
  base_url: https://opencode.ai/zen/go/v1
  api_key_env: OPENCODE_API_KEY
  models_path: https://opencode.ai/zen/go/v1/models
  session_header: x-opencode-session

# Subscription windows are read from the Go lane's usage endpoint.  The probe
# lives in the gateway (`gateway/quota/probes.py`); the shim only names it.
quota:
  probe: opencode_go
  # Refresh the windows in the background so routing learns a reset
  # without waiting for a request to fail.
  interval: 300

# No OpenAI profile traits, verified live 2026-10-12 (see #899).  OpenCode is
# a multi-vendor proxy, so its Responses surface is not uniform across models:
#
#   gpt-5.6-luna      -> id "resp_02db..."   (OpenAI-style prefix)
#   deepseek-v4-flash -> id "48289bda-..."   (bare UUID)
#
# Neither model echoes a ``store`` field, and of the OpenAI lifecycle fields
# only ``moderation`` appears, always null.  A single shim-level trait set
# cannot describe both models, so none is declared here: ``store_default: true``
# would fabricate a field the upstream never returns, and a shim-level
# ``response_id_prefix`` would have to be wrong for one of the two families.
