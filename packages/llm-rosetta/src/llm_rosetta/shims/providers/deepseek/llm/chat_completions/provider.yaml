name: deepseek--chat_completions
model_type: llm
format: chat_completions
logo: https://cdn.jsdelivr.net/npm/@lobehub/icons-static-svg@latest/icons/deepseek.svg

connection:
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
reasoning:
  thinking_modes:
    # No "auto" — DeepSeek R1 requires explicit enable/disable.
    # mode:auto requests will produce effort only, no thinking block.
    enabled: enabled
    disabled: disabled
  effort_field: reasoning_effort
  effort_range: [low, max]
  # Thinking mode rejects a replayed history whose assistant turns omit
  # ``reasoning_content`` once tools are in play.  A client that replays
  # history across a format boundary drops the reasoning for some turns, so
  # the capability pass fills an empty value (accepted by the API) instead of
  # letting the request fail.  See #948, epic #1143.
  replay_missing: fill_empty
