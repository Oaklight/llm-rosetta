# The ChatGPT *plan* lane authenticates with a credential this vendor's
# ``auth.py`` mints — an interactive first sign-in, a rotating refresh token and
# a stored record — not with an API key.  There is deliberately no
# ``api_key_env`` here: inheriting OPENAI_API_KEY would hand the loader a static
# key beside an exchange, which it refuses.

connection:
  # The access token issued to an app lives 3600 s.  A 3600 s refresh interval
  # can therefore land after the token expired; 2880 s renews it twelve
  # minutes early, matching the record's ``earliest_refresh_at``.  Credential
  # defaults belong in this manifest, never in a leaf.
  token_refresh_interval: 2880
