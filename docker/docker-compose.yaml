# This is the image version: it runs the published
# oaklight/llm-rosetta-gateway image.  To build from this checkout instead,
# see docker/docker-compose.source.yaml.
#
# NOTE: Inside the container, "localhost" / "127.0.0.1" refers to the
# container itself, NOT the host machine. If your config.jsonc uses a
# proxy or base_url pointing to the host (e.g. a local proxy server),
# replace "localhost" with one of:
#   - "host.docker.internal"  (Docker Desktop on macOS/Windows)
#   - "172.17.0.1"            (default Docker bridge on Linux)
#   - the actual LAN IP of your host
#
# Example in config.jsonc:
#   "server": { "proxy": "http://host.docker.internal:7890" }
#   "providers": { "my_local": { "base_url": "http://172.17.0.1:11434/v1" } }

services:
  llm-rosetta-gateway:
    image: oaklight/llm-rosetta-gateway
    ports:
      - "8765:8765" # Gateway API + admin panel
    volumes:
      - ./config:/config # Mount your config directory (contains config.jsonc)
      # --- ALCF token passthrough (uncomment to enable) ---
      # The ALCF shims ship the Globus exchange, so the container only needs
      # the token file it refreshes.  Login on the host first:
      #   python3 -m llm_rosetta_shim_alcf.providers.alcf.token --login
      # Then add the ALCF provider via the admin panel; no token_command.
      #
      # - ~/.globus:/home/appuser/.globus            # Globus token file (rw for refresh)
    # Runtime uid/gid.  The image declares USER appuser (uid 1000); this runs the
    # container as the host user instead, so the bind-mounted config/ (and any
    # other bind mount) must be writable by this uid.
    user: "${PUID:-1000}:${PGID:-1000}"
    # No HOME here: this file may run an image built before the entrypoint
    # learned to resolve HOME (see docker/entrypoint.sh), and setting it would
    # replace appuser's /home/appuser for uid 1000.  A uid without a passwd
    # entry gets /config/home from the entrypoint; its Sign in with ChatGPT
    # record (Path.home()/.config) then lands under config/, which must belong
    # to that uid.  A PUID other than 1000 therefore needs an image published
    # after that entrypoint change — an older tag leaves HOME at "/".
    # API keys — referenced as ${ENV_VAR} in config.jsonc; uncomment to pass:
    # environment:
    #   - OPENAI_API_KEY=sk-xxx
    #   - ANTHROPIC_API_KEY=sk-ant-xxx
    #   - GOOGLE_API_KEY=xxx
    # Uncomment to allow the container to reach host services via "host.docker.internal"
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # Raise fd limit — the gateway holds many concurrent upstream connections
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
