site_name: LLM-Rosetta
site_description: LLM-Rosetta - LLM 提供方之间的统一消息格式转换库
site_author: Peng Ding
site_url: https://llm-rosetta.readthedocs.io/zh-cn/latest
repo_name: Oaklight/llm-rosetta
repo_url: https://github.com/Oaklight/llm-rosetta
copyright: Copyright &copy; 2024 Peng Ding

theme:
  name: material
  custom_dir: overrides
  logo: images/rosetta_stone.svg
  favicon: images/favicon.svg
  language: zh
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 切换到浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 跟随系统偏好
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - navigation.path
    - navigation.tracking
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.prune
    - header.autohide
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.tabs.link
    - content.tooltips
    - content.footnote.tooltips

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_toc_entry: false
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Oaklight/llm-rosetta
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/llm-rosetta/
  alternate:
    - name: English
      link: /en/latest/
      lang: en
    - name: 中文
      link: /zh-cn/latest/
      lang: zh

nav:
  - 首页: index.md
  - 快速入门:
      - 安装: getting-started/installation.md
      - 核心概念: guide/concepts.md
      - 库快速开始: getting-started/library-quickstart.md
      - 网关快速开始: getting-started/gateway-quickstart.md
  - 指南:
      - IR 与类型系统:
          - IR 类型: guide/ir-types.md
          - API 分层: guide/api-layers.md
          - API 格式:
              - 文本生成: guide/api-standards.md
              - Rerank: guide/rerank-formats.md
              - Embedding: guide/embedding-formats.md
      - 转换器:
          - 使用转换器: guide/converters.md
          - 流式处理: guide/streaming.md
          - 多轮状态桥接: guide/turn-bridge.md
          - 自动检测: guide/auto-detection.md
      - 提供方:
          - 提供方兼容性: guide/compatibility.md
          - 提供方 Shim: guide/shims.md
          - 推理 / 思考参数: guide/reasoning.md
          - 提供方推理行为: guide/provider-reasoning.md
      - 示例:
          - examples/index.md
          - 跨提供方对话: examples/cross-provider.md
          - 工具调用: examples/tool-calling.md
  - 网关:
      - gateway/index.md
      - 配置: gateway/configuration.md
      - CLI:
          - CLI 参考: gateway/cli.md
          - CLI 工具集成: gateway/cli-integrations.md
      - 管理:
          - 管理面板: gateway/admin-panel.md
          - Admin API: api/admin.md
      - 集成指南: gateway/integration.md
      - 可观测性: api/observability.md
      - 验证:
          - gateway/validation.md
          - CLI 跨格式测试: gateway/validation-cli.md
          - SDK 与集成测试: gateway/validation-sdk.md
          - 合规性测试: gateway/validation-comply.md
  - 参考:
      - api/index.md
      - 库 API:
          - IR 类型: api/types.md
          - 转换器: api/converters.md
          - Tool Ops: api/tool-ops.md
          - Shims: api/shims.md
          - 工具函数: api/utils.md
      - 贡献:
          - 贡献指南: contributing/guide.md
          - 风格指南: contributing/style-guide.md
          - 架构指南: contributing/architecture.md
          - 命名约定: contributing/naming-conventions.md
      - 路线图: roadmap.md
      - 更新日志: changelog.md
