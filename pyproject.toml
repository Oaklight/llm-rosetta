# Repository tooling.  The distributions live in `packages/`:
#   packages/llm-rosetta/           core (import root `llm_rosetta`)
#   packages/llm-rosetta-gateway/   gateway (import root `llm_rosetta_gateway`)
# Install both for development:
#   pip install -e packages/llm-rosetta -e packages/llm-rosetta-gateway

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["packages", "tests"]
exclude = ["packages/*/src/*/_vendor", "llm_api_simple_tests", "tests/integration"]

[tool.ty.rules]
# pytest.skip() / pytest.fail() are mistyped by some ty pytest stubs;
# the ignore comments flip between needed/unused across ty versions.
too-many-positional-arguments = "ignore"
unused-ignore-comment = "ignore"

[tool.ruff]
target-version = "py310"
exclude = ["packages/*/src/*/_vendor", "llm_api_simple_tests", "tests/integration"]

[tool.ruff.lint]
select = ["E", "F", "UP", "C901"]
ignore = ["UP007", "E501"]  # Allow Union[X, Y] syntax; tolerate long lines

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"packages/*/src/*/_vendor/*" = ["C901", "UP"]

[tool.complexipy]
paths = ["packages", "tests"]
max-complexity-allowed = 30
exclude = ["packages/*/src/*/_vendor"]

[tool.zerodep]
vendor-dir = "packages/llm-rosetta/src/llm_rosetta/_vendor"
